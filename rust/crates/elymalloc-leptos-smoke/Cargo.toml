[package]
name = "elymalloc-leptos-smoke"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Leptos reactive_graph WASM GlobalAlloc stress for elymalloc-core"

[dependencies]
elymalloc-core = { path = "../elymalloc-core" }
any_spawner = { version = "0.3", default-features = false, features = ["futures-executor"] }
reactive_graph = { version = "0.2", default-features = false, features = ["effects"] }
