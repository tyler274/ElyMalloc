[package]
name = "mimalloc-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Test harness for the Rust mimalloc rewrite (C ABI, WASM, compiler-suite oracle)"

[lib]
name = "mimalloc_harness"

[[bin]]
name = "mimalloc-harness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
wait-timeout = "0.2"
walkdir = "2"
wasmparser = "0.227"
which = "7"
