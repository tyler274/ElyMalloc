[workspace]
resolver = "2"
members = [
    "crates/mimalloc-core",
    "crates/mimalloc-c",
    "crates/mimalloc-wasm-smoke",
    "crates/mimalloc-harness",
    "crates/mimalloc-alloc-stress",
    "crates/mimalloc-bench",
    "crates/vma-core",
    "crates/vma-c",
]
default-members = ["crates/mimalloc-core", "crates/mimalloc-c"]

[workspace.package]
version = "3.5.0"
edition = "2021"
license = "MIT"
authors = ["mimalloc contributors"]
description = "Pure-Rust rewrite of mimalloc with a C ABI drop-in"

[workspace.dependencies]
libc = { version = "0.2", default-features = false }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
