# musl defaults to fully static binaries, which cannot produce a cdylib.
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.riscv64gc-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

# cargo test -p elymalloc-core --target wasm32-wasip1
[target.wasm32-wasip1]
runner = "wasmtime"

# elymalloc-core tests share the process-global heap/page map. Parallel
# rustc test threads reuse live blocks (NixOS checkPhase: chaos cookies
# and heap_visit counts). Force one test at a time.
[env]
RUST_TEST_THREADS = { value = "1", force = true }
