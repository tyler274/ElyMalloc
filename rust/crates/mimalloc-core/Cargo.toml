[package]
name = "mimalloc-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "no_std mimalloc v3.5.0 core (size classes, pages, heaps; always-on MI_SECURE mitigations)"

[features]
default = []
debug-fill = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc.workspace = true

[lib]
name = "mimalloc_core"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
