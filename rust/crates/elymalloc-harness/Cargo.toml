[package]
name = "elymalloc-harness"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Test harness: C ABI, wasm, compiler oracle, world/browsers/projects, CPython, Leptos, VMA 3.4"

[lib]
name = "elymalloc_harness"

[[bin]]
name = "elymalloc-harness"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
wait-timeout = "0.2"
walkdir = "2"
wasmparser = "0.227"
which = "7"
